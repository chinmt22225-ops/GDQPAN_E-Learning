version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: gdqpan_demo_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: elearning_gdqpan
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_demo_data:/data/db
    healthcheck:
      test: test $$(mongosh --quiet --eval "try { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok } catch(e) { rs.status().ok }") -eq 1
      interval: 10s
      start_period: 15s

  redis:
    image: redis:7.2-alpine
    container_name: gdqpan_demo_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_demo_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gdqpan_demo_app
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/elearning_gdqpan?replicaSet=rs0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLIENT_URL: http://localhost:4000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend/uploads:/app/apps/backend/uploads

volumes:
  mongo_demo_data:
  redis_demo_data:
